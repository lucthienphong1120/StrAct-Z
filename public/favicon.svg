<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Strava Orange Circle Background -->
  <circle cx="16" cy="16" r="14.5" fill="#fc4c02"/>
  <!-- Head -->
  <circle cx="14" cy="8" r="2.2" fill="#ffffff"/>
  <!-- Torso & Limbs matching the classic runner pictogram -->
  <path d="M14 10.5 L13 17" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Arms -->
  <path d="M9 13.5 L13.5 12 L18 13.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Left Leg (forward) -->
  <path d="M13 17 L10.5 20.5 L8.5 24" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right Leg (backward) -->
  <path d="M13 17 L16.5 20.5 L19.5 24" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
