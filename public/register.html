<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - StrAct Z</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at center, var(--bg-card) 0%, var(--bg-primary) 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      border-radius: var(--radius-xl);
      background: var(--gradient-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      text-align: center;
    }
    .login-logo { font-size: 3rem; margin-bottom: 10px; }
    .login-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 5px; }
    .login-subtitle { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 30px; }
    .login-form { text-align: left; }
    #registerError {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 10px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">🚀</div>
      <h1 class="login-title">Create Account</h1>
      <p class="login-subtitle">Join StrAct Z to generate activities</p>
      
      <div id="registerError"></div>

      <form class="login-form" id="registerForm">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-input" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-input" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Register</button>
      </form>
      <div style="margin-top: 15px; font-size: 0.9rem;">
        <a href="/login.html" style="color: var(--accent-blue); text-decoration: none;">Already have an account? Login</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv = document.getElementById('registerError');
      const btn = e.target.querySelector('button');

      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating...';
      errorDiv.style.display = 'none';

      try {
        const res = await fetch('/auth/system/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (res.ok && data.success) {
          // Auto login after registration
          const loginRes = await fetch('/auth/system/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          if (loginRes.ok) {
            window.location.href = '/';
          } else {
            window.location.href = '/login.html';
          }
        } else {
          errorDiv.textContent = data.error || 'Registration failed';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Connection error. Please try again.';
        errorDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    });
  </script>
</body>
</html>
